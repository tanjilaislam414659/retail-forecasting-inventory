[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-forecasting-api"
version = "0.1.0"
description = "Local historical-demo API for the frozen weekday-mean forecaster."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["retail-forecasting==0.1.0", "fastapi==0.121.1", "pydantic==2.12.4", "uvicorn==0.38.0"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
retail-forecasting-api = "retail_forecasting.service.__main__:main"

[tool.setuptools.packages.find]
where = ["../src"]
include = ["retail_forecasting.service*"]
namespaces = false
